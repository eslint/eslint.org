sponsors_page:
  title: प्रायोजक
  description: >
    BACKER_COUNT कंपनियां, संगठन और व्यक्ति वर्तमान में चल रहे ESLint के रखरखाव और विकास के समर्थन के लिए हर महीने MONTHLY_DONATIONS का योगदान दे रहे हैं

  hero:
    cta:
      text: एक प्रायोजक बनें
      url: /donate
  tiers:
    diamond:
      title: डायमंड प्रायोजक
      description: >
        $5,000 USD के मासिक दान के साथ डायमंड प्रायोजक बनें। आपका Open Collective या GitHub अवतार चित्र हमारे GitHub के
        README और eslint.org की होम पेज पर प्रदर्शित किया जाएगा। हम अपने ट्विटर खाते
        (38,000 से अधिक अनुयायियों) से भी धन्यवाद ट्वीट करेंगे।
    platinum:
      title: Platinum प्रायोजक
      description: >
        मासिक $2,000 USD के दान के साथ प्लेटिनम प्रायोजक बनें। आपका Open Collective या GitHub अवतार चित्र हमारे GitHub के
        README और eslint.org की होम पेज पर प्रदर्शित किया जाएगा। हम अपने ट्विटर खाते
        (38,000 से अधिक अनुयायियों) से भी धन्यवाद ट्वीट करेंगे।
    gold:
      title: Gold प्रायोजक
      description: >
        $1000 USD के मासिक दान के साथ Gold प्रायोजक बनें।
        Gold प्रायोजक के logo को ESLint README और eslint.org के शीर्ष पृष्ठ पर पाया जा सकता है।
        हम 38,000 से अधिक फॉलोअर्स वाले ESLint के Twitter अकाउंट से भी आपको धन्यवाद देते हैं।
    silver:
      title: Silver प्रायोजक
      description: >
        $500 USD के मासिक दान के साथ Silver प्रायोजक बनें।
        Gold प्रायोजक के logo को ESLint README और eslint.org के शीर्ष पृष्ठ पर पाया जा सकता है।
    bronze:
      title: Bronze प्रायोजक
      description: >
        $200 USD के मासिक दान के साथ Bronze प्रायोजक बनें।
        Bronze प्रायोजक के logo को ESLint README और eslint.org के शीर्ष पृष्ठ पर पाया जा सकता है।
    technology:
      title: Technology प्रायोजक
      description: >
        ओपन सोर्स इकोसिस्टम और हमारे काम में हमारे योगदान के हिस्से के रूप में technology प्रायोजक हमारे उत्पादों और सेवाओं को मुफ्त में लाइसेंस देते हैं।
    backers:
      title: सभी समर्थक
      description: >
        ESLint को बनाए रखने में सहायता के लिए समर्थक मासिक योगदान प्रदान करते हैं।

  recent_donations:
