  description: >
    ये वे लोग हैं जो ESLint का निर्माण और रखरखाव करते हैं।
  tsc:
    title: Technical Steering Committee
    description: >
      जो लोग रिलीज का प्रबंधन करते हैं, फीचर अनुरोधों की समीक्षा करते हैं, और यह सुनिश्चित करने के लिए नियमित रूप से मिलते हैं कि ESLint को ठीक से बनाए रखा गया है।
  reviewers:
    title: Reviewers
    description: >
      जो लोग नई सुविधाओं की समीक्षा करते हैं और उन्हें लागू करते हैं।
  committers:
    title: Committers
    description: >
      वे लोग जो बग की समीक्षा करते हैं और उन्हें ठीक करते हैं।
  website_team:
    title: Website Team
    description: >
      टीम के सदस्य जो विशेष रूप से eslint.org पर ध्यान केंद्रित करते हैं।
  support_team:
    title: Support Team
    description: >
      कलह और चर्चा में मदद करने वाले लोग।.
  alumni:
    title: Alumni
    description: >
      टीम के पूर्व सदस्य जिन्होंने पहले ESLint को बनाए रखने में मदद की थी।

