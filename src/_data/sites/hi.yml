    subtitle: हम निम्नलिखित साइटों के माध्यम से दान स्वीकार करते हैं।
    open_collective:
      title: Open Collective
      subtitle: निगमों के लिए सबसे लोकप्रिय योजना
      cta:
        text: Open Collective के माध्यम से योगदान करें
      items:
        - text: 501(c)(6) गैर-लाभकारी संस्थाओं को प्रत्यक्ष दान
        - text: अस्थायी और नियमित दान
        - text: आप क्रेडिट कार्ड, बैंक हस्तांतरण, PayPal द्वारा भुगतान कर सकते हैं
        - text: एक ओपन सोर्स फंड लॉन्च करके कई परियोजनाओं के लिए दान संभव है
        - text: अधिकांश देशों में उपलब्ध
    github_sponsors:
      title: GitHub Sponsors
      subtitle: उन्नत सुविधाएँ और रिपोर्ट
      cta:
        text: GitHub के माध्यम से योगदान करें
      items:
        - text: GitHub को भुगतान द्वारा दान
        - text: अस्थायी और नियमित दान
        - text: आप क्रेडिट कार्ड से भुगतान कर सकते हैं या मौजूदा GitHub बिलिंग विधियों (चालान सहित) का उपयोग कर सकते हैं
        - text: अपने GitHub प्रोफ़ाइल पर "sponsor" बैज दिखाएं
        - text: अपने मौजूदा GitHub लॉगिन का उपयोग करें
  budget:
    title: धन का उपयोग
    subtitle: >
      ESLint परियोजना, परियोजना और ESLint समुदाय को समग्र रूप से लाभान्वित करने के लिए दान किए गए धन का उपयोग करती है।
      सामान्य तौर पर, हम हर महीने निम्नलिखित क्षेत्रों पर पैसा खर्च करते हैं।
    items:
      - name: टीम विकास
        text: >
          हम अपनी टीम के सदस्यों को उनकी वरिष्ठता के आधार पर एक घंटे की दर से भुगतान करते हैं,
          वर्तमान में, हम TSC सदस्यों और समीक्षकों के लिए HOURLY_RATE_TSC USD/घंटा और कमिटर्स के लिए
          HOURLY_RATE_COMMITERS USD/घंटे का भुगतान करते हैं। टीम के सदस्यों को प्रति माह अधिकतम
          MAX_MONTHLY_HOURS घंटों के लिए भुगतान किया जाता है।
      - name: निर्भर परियोजनाएं
        text: >
          हम अपनी निर्भरता का समर्थन करने में सहायता के लिए प्रत्येक माह अपनी मासिक आय का DEPENDENCIES_PERCENTAGE% अलग रखते हैं।
          हमारा मानना है कि ओपन-सोर्स प्रोजेक्ट्स, जो वित्त पोषित होने के लिए भाग्यशाली हैं, उन्हें छोटी परियोजनाओं का समर्थन करने में मदद करने की ज़िम्मेदारी है जिन पर वे निर्भर हैं।
      - name: सामुदायिक परियोजना
        text: >
          हम प्लगइन्स, पार्सर्स और अन्य परियोजनाओं के लिए हर महीने अपनी मासिक आय का COMMUNITY_PERCENTAGE% सुरक्षित करते हैं जो पूरे ESLint पारिस्थितिकी तंत्र के लिए फायदेमंद हैं।
          हम मानते हैं कि परियोजना की ताकत इसके पारिस्थितिकी तंत्र में निहित है, हमें उम्मीद है कि महत्वपूर्ण परियोजनाओं को बनाए रखा जाएगा।
      - name: समर्थन प्रणाली
        text: >
          हम हर महीने एक छोटी राशि का उपयोग उस सॉफ़्टवेयर के भुगतान के लिए करते हैं जिसका उपयोग टीम प्रबंधन में सहायता के लिए करती है जिसमें Google Workspace और cloud storage जैसी चीज़ें शामिल हैं।
    footer:
      text: >
        इसके अतिरिक्त, समय-समय पर हम ठेकेदारों को परियोजना के लिए महत्वपूर्ण चीजों पर काम करने के लिए भुगतान करने के लिए धन का उपयोग करते हैं
        जहां टीम के पास काम को खुद पूरा करने के लिए समय या विशेषज्ञता नहीं है।
        उदाहरण के लिए, हमने हाल ही में एक डिज़ाइनर और डेवलपर को इस वेबसाइट को फिर से डिजाइन करने के लिए काम पर रखा है।
        हम यह सुनिश्चित करते हैं कि हम हर महीने जितना धन अर्जित करते हैं उससे कम खर्च करें ताकि हम ऐसी परियोजनाओं के लिए बचत कर सकें।
  donation_tiers:
    title: दान स्तरीय प्रणाली
    subtitle: हालाँकि हम किसी भी आकार का दान स्वीकार करते हैं, हमारे पास प्रत्येक स्तर पर अलग-अलग पुरस्कारों के साथ एक स्तरीय प्रणाली है।
    cta:
      open_collective_text: >
        <span class="visually-hidden">Open Collective</span> पर दान करें
      github_sponsors_text: >
        <span class="visually-hidden">GitHub</span> पर दान करें
    items:
      - name: डायमंड प्रायोजक
        amount: $5000+
        frequency: प्रति माह
        text: होमपेज और रीडमी पर सबसे ऊंचा लोगो प्लेसमेंट और प्लेटिनम स्तर में सब कुछ।
      - name: प्लेटिनम प्रायोजक
        amount: $2000-4999
        frequency: प्रति माह
        text: होमपेज और रीडमी पर दूसरा सबसे ऊंचा लोगो प्लेसमेंट और गोल्ड स्तर में सब कुछ।
      - name: गोल्ड प्रायोजक
        amount: $1000–1999
        frequency: प्रति माह
        text: होमपेज और रीडमी पर तीसरा सबसे ऊंचा लोगो प्लेसमेंट, हमारे ट्विटर अकाउंट (38,000 फॉलोअर्स) से एक धन्यवाद ट्वीट और एक वैकल्पिक धन्यवाद ब्लॉग पोस्ट।
      - name: सिल्वर प्रायोजक
        amount: $500–999
        frequency: प्रति माह
        text: होमपेज और रीडमी पर चौथा सबसे ऊंचा लोगो प्लेसमेंट।
      - name: ब्रॉन्ज प्रायोजक
        amount: $200–499
        frequency: प्रति माह
        text: होमपेज और रीडमी पर पांचवां सबसे ऊंचा लोगो प्लेसमेंट।

  testimonials:
    title: प्रशंसापत्र
    items:
      - name: Addy Osmani
        title: Senior Staff Eng. Manager, Chrome
        image: addy-osmani.jpg
        text: >
          कई वर्षों से ESLint ने उच्च गुणवत्ता वाली JavaScript लिखने के लिए डेवलपर्स के लिए एक महत्वपूर्ण भूमिका निभाई है। सामान्य समस्याओं को जल्दी और अक्सर पकड़ना बहुत फायदेमंद होता है।
          ESLint टीमों को उनके अनुरूप कस्टम नियम लागू करने की अनुमति देता है। यह ओपन सोर्स प्रोजेक्ट्स में भी बहुत प्रभावी है। ESLint के प्रायोजक के रूप में, क्रोम वेब डेवलपर्स को लगातार उच्च गुणवत्ता कोड लिखने में मदद करने में प्रसन्न है।
          यह आधुनिक वेब विकास टूलकिट का एक अभिन्न अंग है।
      - name: Jeff Cross
        title: Co-founder and Principal Architect, Nx
        image: jeff-cross.jpg
        text: >
          Nx कोड गुणवत्ता, पुस्तकालय सीमाओं और परियोजना दृश्यता को लागू करने के लिए ESLint का उपयोग करता है। ESLint Nx को अधिक शक्तिशाली बनाता है, इसलिए Nx.dev समुदाय की ओर से,
          हमें अपनी भूमिका निभाने और ESLint की निरंतर सफलता को प्रायोजित करने पर गर्व है!
      - name: Médédé Raymond KPATCHAA
        title: Technical Architect, Salesforce
        image: medede-kpatchaa.jpg
        text: >
          ESLint किसी भी JavaScript प्रोजेक्ट के लिए एक बहुत ही उपयोगी टूल है। यह उपकरण आपको अपने प्रोजेक्ट की शुरुआत से ही लगातार कोड स्वरूपण नियम निर्धारित करने की अनुमति देता है, इस्से कोड समीक्षा बहुत आसान हो जाएगी और नए डेवलपर आसानी से अपनी टीम के अनुकूल हो सकेंगे।
          मुझे पता है कि मैं इसके लचीलेपन और उपयोग में आसानी की सराहना करने वाला अकेला नहीं हूं।
      - name: Duane O'Brien
        title: Head of Open Source, Indeed
        image: duane-obrien.jpg
        text: >
          अधिकांश जावास्क्रिप्ट प्रोजेक्ट सीधे या संक्रमणीय रूप से ESLint पर निर्भर करते हैं। एक वर्तमान कर्मचारी
          ने FOSS Contributor Fund से दान प्राप्त करने के लिए ESLint को नामांकित किया,
          और उनके सहयोगी स्पष्ट रूप से सहमत थे। ओपन सोर्स टेक्नोलॉजी हमें डिजिटल इंफ्रास्ट्रक्चर को विकसित करने,
          संरक्षित करने और बनाए रखने में सक्षम बनाती है जो हमारे उत्पादों को रेखांकित करती है और लोगों को रोजगार
          खोजने में मदद करती है। हमें ओपन सोर्स टेक्नोलॉजी का समर्थन करने में सक्षम होने की खुशी है।
      - name: Gajus Kuizinas
        title: Co-Founder / CTO, Contra
        image: gajus.jpg
        text: >
          ESLint लगातार बढ़ते कोड बेस और इंजीनियरों के लिए एक सुरक्षित और सुसंगत अनुभव प्रदान करने में एक प्रमुख भूमिका निभाता है।
          हम उन सभी ओपन सोर्स प्रोजेक्ट्स के आभारी हैं जिन्होंने Contra बनाने में मदद की है और ESLint कई ओपन सोर्स प्रोजेक्ट्स में
          से पहला है जिसका हम समर्थन करने का वादा करते हैं।

  faq:
    title: सामान्य प्रश्न
    description: उत्पादों और बिलिंग के बारे में सभी जानकारी। आप जिस उत्तर की तलाश कर रहे हैं वह नहीं मिल रहा है? आप हमारी दोस्ताना टीम के साथ भी चैट कर सकते हैं।
    items:
      - q: दान किया गया धन कौन प्राप्त करेगा?
        a: सभी योगदान, चाहे वह <a href='https://opencollective.com'>Open
          Collective</a> के माध्यम से दान किया गया हो या GitHub के माध्यम से, Open Source Collective द्वारा प्राप्त किए जाते हैं, जो एक 501 (c) (3) गैर-लाभकारी संगठन है।
          Open Source Collective, ESLint के लिए एक वित्तीय मेजबान के रूप में कार्य करता है और सभी दान का ट्रैक रखता है।
      - q: क्या दान रसीद जारी करना संभव है?
        a: हां। यदि आपने ओपन कलेक्टिव के साथ दान किया है, तो हम आपको एक पीडीएफ रसीद भेजेंगे। यदि आप GitHub के माध्यम से दान करते हैं, तो दान आपकी रसीद पर दिखाई देगा।
      - q: क्या मेरा दान कर कटौती योग्य है?
        a:
          नहीं, भले ही Open Source Collective एक 501 (c) (3) गैर-लाभकारी संगठन है,
          IRS ओपन सोर्स सॉफ्टवेयर के विकास को धर्मार्थ गतिविधि नहीं मानता और इसलिए कर-मुक्त स्थिति प्रदान नहीं करता है।
      - q: धन के वितरण का निर्णय कौन करता है ?
        a: TSC तय करती है कि किसे कितना पैसा मिलेगा।
      - q: क्या यह जांचना संभव है कि पैसा कैसे खर्च किया जाता है?
        a:
          हां। हमारे Open Collective पेज पर जाकर, आप हर उस खर्च को देख सकते हैं जिसे
          जमा किया गया और भुगतान किया गया। सभी लेनदेन पूरी तरह से खुले और सार्वजनिक रूप से दृश्यमान हैं।
      - q: क्या मैं अपना आवर्ती दान किसी भी समय रद्द कर सकता हूँ?
        a: हां। कोई दीर्घकालिक प्रतिबद्धता नहीं है। आप किसी भी समय Open Collective या GitHub Sponsors में लॉग इन करके अपना दान रद्द कर सकते हैं।
      - q: लोगो को मुखपृष्ठ, GitHub, और npm पैकेज पर प्रदर्शित होने में कितना समय लगता है?
        a:
          होमपेज और गिटहब पर लोगो हर दिन स्वचालित रूप से अपडेट होते हैं, इसलिए यह प्रकट होने में 24 घंटे से अधिक समय नहीं लगना चाहिए।
          npm पैकेज पर लोगो केवल तभी अपडेट किया जाता है जब हम एक नई रिलीज़ प्रकाशित करते हैं, जो आमतौर पर हर दो सप्ताह में होती है।
          हालाँकि, प्रमुख रिलीज़ को पूरा होने में अक्सर कई महीने लग जाते हैं और उस दौरान
          npm पैकेज पर टाइम लोगो अपडेट नहीं किया जाएगा।
      - q: मेरा लोगो और URL कहाँ से आता है?
        a:
          आपके द्वारा दान की गई साइट के आधार पर लोगो और URL आपके Open Collective या GitHub प्रोफ़ाइल से लिया जाएगा।
          इसे ओपन कलेक्टिव या गिटहब से किसी भी समय अपडेट किया जा सकता है और 24 घंटे के भीतर होमपेज और GitHub README में दिखाई देगा।
          हम अपनी साइट पर लोगो या URL को मैन्युअल रूप से अधिलेखित नहीं कर सकते।
      - q: क्या एकमुश्त दान करना संभव है?
        a:
          हां। एकमुश्त दान करने का सबसे आसान तरीका ओपन Open Collective का उपयोग करना है। आप कोई भी राशि दान कर सकते हैं।
          GitHub पर अस्थायी दान की एक सीमित राशि हो सकती है।

