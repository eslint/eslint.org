homepage:
  title: अपने JavaScript कोड में समस्याओं का पता लगाएं और उन्हें ठीक करें
  description: >
    ESLint आपके कोड का सांख्यिकीय रूप से विश्लेषण करता है और जल्दी से समस्याओं का पता लगाता है। अधिकांश text editor में निर्मित, आप अपनी CI पाइपलाइन के भाग के रूप में ESLint चला सकते हैं।

  animation:
    enabled: false
    text: अपने JavaScript कोड में समस्याओं का पता लगाएं और उन्हें ठीक करें
    highlight_word: problems
    wrong_word: problmes

  install:
    title: ESLint इंस्टॉल कमांड
    copy: इंस्टॉलेशन कमांड को कॉपी करें
    copied: क्लिपबोर्ड पर नकल।

  sponsor:
    text: 'Sponsored by:'
    more: and more...

  versions:
    title: ESLint संस्करण
    latest: नवीनतम संस्करण
    latest_prerelease: Latest Prerelease Version
    upcoming: आगामी संस्करण
    development: विकास संस्करण के तहत
    dateline: VERSION on DATE
    version_support: Version Support

  explainer:
    image:
      src: eslint-features-img.png
      alt: "Screenshot of a Visual Studio code window with ESLint in action: underlining ESLint error in the editor."
    title: The pluggable linting utility for JavaScript and JSX
    description: >
      ESLint एक open source प्रोजेक्ट है जो आपको अपने JavaScript कोड के साथ समस्याओं को खोजने और ठीक करने में मदद करता है। इससे कोई फर्क नहीं पड़ता कि आप ब्राउज़र में या सर्वर पर JavaScript लिख रहे हैं, चाहे आप framework का उपयोग कर रहे हों या नहीं, ESLint आपके कोड को अच्छी स्थिति में रहने में मदद कर सकता है।
    features:
      - title: समस्याओं का पता लगाएं
        description: >
          ESLint आपके कोड का सांख्यिकीय रूप से विश्लेषण करता है और जल्दी से समस्याओं का पता लगाता है। ESLint अधिकांश text editor में बनाया गया है और इसे CI पाइपलाइन के भीतर भी चलाया जा सकता है।
        learn_more:
          link: getStarted
          text: >
            Learn more <span class="visually-hidden">about finding issues with ESLint</span>
      - title: समस्याओं को अपने आप ठीक करें
        description: >
          ESLint द्वारा खोजी गई कई समस्याओं को स्वचालित रूप से ठीक किया जा सकता है। ESLint फिक्स सिंटैक्स-जागरूक हैं, इसलिए आपको पारंपरिक खोज-और-प्रतिस्थापन एल्गोरिदम द्वारा शुरू की गई गलतियों का अनुभव नहीं होगा।
        learn_more:
          link: fixProblems
          text: >
            Learn more <span class="visually-hidden">about fixing problems automatically with ESLint</span>
      - title: सब कुछ कॉन्फ़िगर किया जा सकता है
        description: >
          आप अपने कोड को प्रीप्रोसेस कर सकते हैं, कस्टम पार्सर्स का उपयोग कर सकते हैं, और अपने स्वयं के नियम बना सकते हैं जो ESLint के अंतर्निहित नियमों के साथ काम करते हैं। आप अपनी परियोजना की आवश्यकताओं के अनुरूप ESLint को अनुकूलित कर सकते हैं।
        learn_more:
          link: configuring
          text: >
            Learn more <span class="visually-hidden">about configuring ESLint</span>
  blog:
    view_all_posts: सभी पोस्ट देखें

  stats:
    title: समुदाय में आपका स्वागत है
    description: >
      ESLint npm डाउनलोड (DOWNLOAD_COUNT और ऊपर) के साथ नंबर 1 JavaScript लिंटर है।
      Microsoft, Airbnb, Netflix और Facebook जैसी कंपनियों द्वारा उपयोग किया जाता है।
    dependents: निर्भरता
    weekly_downloads: साप्ताहिक डाउनलोड
    stars: Stars

  sponsors:
    title: अद्भुत लोगों द्वारा समर्थित
    description: >
      हमें SPONSOR_COUNT प्रायोजकों से दान में ANNUAL_DONATIONS / वर्ष प्राप्त होता है।
    view_all_sponsors: सभी प्रायोजक देखें

  donations:
    title: हाल ही में एकमुश्त दान
    view_all_donations: सभी दान देखें

